<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Receipt Not Found | Algorithmic Gold</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0f'/%3E%3Cpath d='M8 22l8-14 8 14' stroke='%23f5c542' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0a0f;--surface:#14141d;--ink:#f4f4f6;--muted:#9a9aa8;--dim:#6b6b7a;--border:#262633;--gold:#f5c542;--red:#f87171;--green:#4ade80;--mono:ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
.box{max-width:560px;text-align:center}
.code{font-family:var(--mono);font-size:clamp(72px,14vw,128px);font-weight:700;color:var(--gold);letter-spacing:-.04em;line-height:1}
h1{font-size:26px;margin:18px 0 12px;letter-spacing:-.02em}
p{color:var(--muted);margin-bottom:10px}
.receipt{font-family:var(--mono);font-size:13px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin:26px 0;color:var(--muted)}
.receipt .r{color:var(--red)}
.receipt .g{color:var(--green)}
a.btn{display:inline-block;background:var(--gold);color:#000;font-weight:700;padding:14px 32px;border-radius:11px;text-decoration:none;margin-top:10px;min-height:48px;line-height:20px}
a.btn:hover{text-decoration:none;opacity:.9}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Receipt not found</h1>
  <p>Even a failed lookup gets a report. That's the standard.</p>
  <div class="receipt">
    <div>gate: lookup ............. <span class="r">FAIL</span></div>
    <div>page: this URL ........... <span class="r">not found</span></div>
    <div>honesty check ............ <span class="g">PASS</span> (we admit it)</div>
    <div>next action .............. return to the standard</div>
  </div>
  <a class="btn" href="/algorithmic-gold/">← Back to Algorithmic Gold</a>
</div>
</body>
</html>
